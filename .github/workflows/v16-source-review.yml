name: Review staged 1.6 source
on:
  push:
    branches: [v16-destinations-uat-20260908]
    paths: ['.github/workflows/v16-source-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Export staged source
        run: |
          mkdir -p artifacts/review
          python3 - <<'PY'
          from pathlib import Path
          import lzma,base64
          p=Path('.ci-transfer/v16-source.01.b64')
          encoded=p.read_text().strip()
          data=base64.b64decode(encoded)
          d=lzma.LZMADecompressor()
          plain=d.decompress(data)
          Path('artifacts/review/partial-source.json.txt').write_bytes(plain)
          Path('artifacts/review/source-1.b64').write_text(encoded)
          print('Decoded staged bytes:',len(plain),'complete:',d.eof)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v16-source-review
          path: artifacts/review
          retention-days: 7
