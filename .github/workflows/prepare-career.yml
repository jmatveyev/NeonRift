name: Prepare career release
on:
  push:
    branches: [career-engagement-20260907]
    paths:
      - 'tools/engagement/**'
      - '.github/workflows/prepare-career.yml'
permissions:
  contents: write
concurrency:
  group: prepare-neon-rift-career
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: career-engagement-20260907
      - name: Assemble career release
        run: python3 tools/engagement/apply.py
      - name: Validate launch files and JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs');
          const a=fs.readFileSync('index.html','utf8');
          const b=fs.readFileSync('neon-rift.html','utf8');
          if(a!==b) throw new Error('Launch files differ');
          const scripts=[...a.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(!scripts.length) throw new Error('No inline game script found');
          for(const s of scripts) new Function(s[1]);
          const required=['careerScreen','profileBtn','careerPilotInput','achievementGrid','careerLeaderboard','resultCareerBtn','resultShareBtn'];
          for(const id of required) if(!a.includes(`id="${id}"`)) throw new Error(`Missing ${id}`);
          for(const token of ['recordCompletedRun(won, cause)','G.damageTaken','G.dashes++','G.overdrives++','NEON_RIFT_ONLINE']) if(!a.includes(token)) throw new Error(`Missing ${token}`);
          console.log('Syntax, paired files, UI anchors, and run instrumentation verified.');
          JS
      - name: Verify original save compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "const SAVE_KEY = 'neon-rift-save-v1'" in s
          assert "const CAREER_KEY = 'neon-rift-career-v1'" in s
          assert "rep('music: false','music: true')" not in s
          assert "music: true" in s
          assert "localStorage.setItem(SAVE_KEY" in s
          assert "localStorage.setItem(CAREER_KEY" in s
          print('Original save key preserved; career storage is isolated; music default remains on.')
          PY
      - name: Commit assembled release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html neon-rift.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Assemble Neon Rift career release 1.2.0'
          git push origin HEAD:career-engagement-20260907
