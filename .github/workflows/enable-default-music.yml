name: Enable music by default
on:
  push:
    branches: [music-default-on-20260907]
    paths:
      - '.github/workflows/enable-default-music.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out music update branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: music-default-on-20260907
      - name: Set music default and rebuild launch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/mobile/build.py')
          s=p.read_text()
          marker="rep('</style>',(root/'mobile.css').read_text()+'\\n</style>')"
          assert marker in s
          if "rep('music: false','music: true')" not in s:
              s=s.replace(marker, marker+"\nrep('music: false','music: true')")
          s=s.replace("expected='d5e36dcb8c095b43339ac6a58c27d6706584c196'", "expected='0cc4b8a9564e26faef1314ff216fb8dcb16d732b'")
          old="not in ['26f50199b84cc6ed8123c70d596e623ebe7d054f',expected]"
          new="not in ['26f50199b84cc6ed8123c70d596e623ebe7d054f','d5e36dcb8c095b43339ac6a58c27d6706584c196',expected]"
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('README.txt')
          r=p.read_text()
          old='Music is off by default; toggle it in the top bar or'
          new='Music is on by default for new players; toggle it in the top bar or'
          assert old in r
          p.write_text(r.replace(old,new))
          PY
          python3 tools/mobile/build.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('index.html').read_bytes(); b=Path('neon-rift.html').read_bytes()
          assert a==b
          text=a.decode()
          assert 'music: true' in text
          assert 'music: false' not in text
          sha=hashlib.sha1((f'blob {len(a)}\0').encode()+a).hexdigest()
          assert sha=='0cc4b8a9564e26faef1314ff216fb8dcb16d732b', sha
          print('Verified release blob:',sha)
          PY
      - name: Commit music default update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.txt tools/mobile/build.py index.html neon-rift.html
          git commit -m 'Enable soundtrack by default for new players'
          git push origin HEAD:music-default-on-20260907
