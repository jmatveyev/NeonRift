name: Validate Neon Rift 1.6 destinations and 4K
on:
  push:
    branches: [v16-destinations-uat-20260908]
    paths:
      - '.github/workflows/prepare-v16.yml'
      - '.ci-transfer/v16-*'
      - 'tools/visual-v16/**'
      - 'tests/v16_regression.py'
      - 'tests/prepare_v16_legacy.py'
permissions:
  contents: write
concurrency:
  group: neon-rift-v16-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out candidate and pinned build history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v16-destinations-uat-20260908
          fetch-depth: 0
      - name: Verify and unpack reviewed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          parts=[Path(f'.ci-transfer/v16-source.{i:02}.b64') for i in range(1,4)]
          if all(p.exists() for p in parts):
              encoded=''.join(p.read_text().strip() for p in parts)
              assert hashlib.sha256(encoded.encode()).hexdigest()=='550577fd5c8678edac2fad8eaa921f1ebda724f95b929981eca131f4a3c69498', 'Source transfer checksum mismatch'
              files=json.loads(lzma.decompress(base64.b64decode(encoded,validate=True)))
              allowed={'README.md','docs/RELEASE-1.6.md','tests/prepare_v16_legacy.py','tests/v16_regression.py','tools/visual-v16/build.py','tools/visual-v16/fallback.js','tools/visual-v16/journey.js','tools/visual-v16/locations.js','tools/visual-v16/models.js','tools/visual-v16/presentation.js','tools/visual-v16/renderer.js','tools/visual-v16/repair.css'}
              assert set(files)==allowed
              decoded={}
              for name,item in files.items():
                  if 'text' in item:
                      text=item['text']
                  else:
                      original=Path(item['base']).read_text()
                      assert hashlib.sha256(original.encode()).hexdigest()==item['sha256'], 'Unexpected base '+item['base']
                      lines=original.splitlines(keepends=True)
                      for start,end,replacement in reversed(item['edits']):
                          assert 0<=start<=end<=len(lines)
                          lines[start:end]=[replacement]
                      text=''.join(lines)
                      assert hashlib.sha256(text.encode()).hexdigest()==item['result'], 'Decoded source mismatch '+name
                  assert isinstance(text,str)
                  decoded[name]=text
              for name,text in decoded.items():
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          else:
              assert Path('tools/visual-v16/build.py').exists(), 'Missing reviewed source'
          print('All reviewed source decoded into ordinary text files.')
          PY
      - name: Build exact candidate and validate launch integrity
        run: |
          python3 tools/visual-v16/build.py
          cp index.html /tmp/neon-rift-1.6-production.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('index.html').read_bytes();b=Path('neon-rift.html').read_bytes()
          assert a==b
          sha=hashlib.sha1((f'blob {len(a)}\0').encode()+a).hexdigest()
          assert sha=='bf0427c6f2e753cb99337915a78e99c2612c1615',sha
          print('Exact candidate:',len(a),'bytes;',sha)
          PY
          node - <<'JS'
          const fs=require('fs'),s=fs.readFileSync('index.html','utf8');
          for(const m of s.matchAll(/<script>([\s\S]*?)<\/script>/g))new Function(m[1]);
          for(const k of ['neon-rift-save-v1','neon-rift-career-v1','neon-rift-player-v1','neon-rift-checkpoint-v1','neon-rift-pilot-confirmed-v1'])if(!s.includes(k))throw Error('Missing save key '+k);
          for(const x of ['application-version" content="1.6.0"','BOREAL ICE BELT','SOLACE SOLAR ARRAY','sectorTravel','graphicsSelect','8294400'])if(!s.includes(x))throw Error('Missing release feature '+x);
          if(s.includes('sb_secret_')||s.includes("'service_role'"))throw Error('Unexpected server secret');
          console.log('Syntax, paired HTML, save keys and client credential checks passed.');
          JS
      - name: Export exact candidate and editable source
        run: |
          mkdir -p artifacts/candidate
          cp index.html artifacts/candidate/index.html
          cp -R tools/visual-v16 artifacts/candidate/source
          cp docs/RELEASE-1.6.md tests/v16_regression.py artifacts/candidate/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-rift-1.6-candidate
          path: artifacts/candidate
          retention-days: 7
      - name: Install browser QA runtime
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright>=1.55,<2' Pillow
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM='+p.chromium.executable_path)
          PY
          python3 tests/prepare_v16_legacy.py
      - name: Inherited input and startup on supported compatibility profile
        id: legacy
        run: |
          trap 'cp /tmp/neon-rift-1.6-production.html index.html' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          for old,new in [("window.NEON_RIFT_ONLINE = {\n  enabled: true,","window.NEON_RIFT_ONLINE = {\n  enabled: false,"),("version: 1, pilot: 'PILOT', xp: 0","version: 1, pilot: 'QA PILOT', xp: 0"),("let savedQuality=localStorage.getItem('neon-rift-graphics-v1');","let savedQuality='compatibility';")]:
              assert s.count(old)==1,old
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          xvfb-run -a python3 tests/.v16_startup_smoke.py
          xvfb-run -a python3 tests/.v16_mobile_controls.py
      - name: Managed runs, audio, callsign and Endless on production profile
        id: managed
        if: ${{ !cancelled() }}
        run: |
          cp /tmp/neon-rift-1.6-production.html index.html
          xvfb-run -a python3 tests/.v16_v13_regression.py
          xvfb-run -a python3 tests/.v16_v131_regression.py
      - name: Inherited real-WebGL scene and touch assertions
        id: graphics
        if: ${{ !cancelled() }}
        run: |
          cp /tmp/neon-rift-1.6-production.html index.html
          xvfb-run -a python3 tests/.v16_v15_regression.py
      - name: 1.6 layout, journey, real storage reload, nine scenes and 4K UAT
        id: uat
        if: ${{ !cancelled() }}
        run: |
          cp /tmp/neon-rift-1.6-production.html index.html
          xvfb-run -a python3 tests/v16_regression.py --suite all
      - name: Collect test evidence
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/evidence
          cp tests/*results*.json artifacts/evidence/ 2>/dev/null || true
          cp -R artifacts/v16 artifacts/evidence/ 2>/dev/null || true
          cp -R artifacts/v15 artifacts/evidence/ 2>/dev/null || true
          cp docs/RELEASE-1.6.md artifacts/evidence/
          cp /tmp/neon-rift-1.6-production.html index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: neon-rift-1.6-uat-evidence
          path: artifacts/evidence
          retention-days: 7
      - name: Commit only after all acceptance gates pass
        if: ${{ success() && steps.legacy.outcome == 'success' && steps.managed.outcome == 'success' && steps.graphics.outcome == 'success' && steps.uat.outcome == 'success' }}
        run: |
          cmp index.html neon-rift.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md docs/RELEASE-1.6.md tools/visual-v16 tests/prepare_v16_legacy.py tests/v16_regression.py index.html neon-rift.html
          git rm -- .ci-transfer/v16-source.01.b64 .ci-transfer/v16-source.02.b64 .ci-transfer/v16-source.03.b64 .github/workflows/v16-source-review.yml
          git diff --cached --quiet || git commit -m 'Ship tested 1.6 destinations, upgrade layout repairs and 4K rendering'
          git push origin HEAD:v16-destinations-uat-20260908
